# Upptime settings for the Deadlio status page

owner: Terrance23a
repo: deadlio-status

sites:
  - name: Deadlio app
    url: "https://app.deadlio.com/?dla_health=public"
    expectedStatusCodes:
      - 200
  - name: Deadlio website
    url: https://deadlio.com

assignees:
  - Terrance23a

status-website:
